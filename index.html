<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Doçura Vera's Buffet — Coffee Break Corporativo e Catering Premium em São Paulo e Rio de Janeiro</title>
    <meta name="description" content="Buffet para eventos corporativos, esportivos e sociais, com coffee breaks e soluções personalizadas em São Paulo e Rio de Janeiro. Atendimento personalizado em São Paulo e Rio de Janeiro." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Doçura Vera's Buffet — Catering Premium e Coffee Break Corporativo" />
    <meta property="og:description" content="Transformamos eventos em experiências memoráveis. Coffee Breaks, Eventos Corporativos e Catering Premium para empresas que valorizam excelência." />
    <meta property="og:url" content="https://docuraverasbuffet.com.br" />
    <meta property="og:site_name" content="Doçura Vera's Buffet" />
    <meta property="og:image" content="https://docuraverasbuffet.com.br/images/og-cover.jpg" />

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["LocalBusiness", "FoodEstablishment"],
        "name": "Doçura Vera's Buffet",
        "description": "Buffet para eventos corporativos, esportivos e sociais, com coffee breaks e soluções personalizadas em São Paulo e Rio de Janeiro.",
        "url": "https://docuraverasbuffet.com.br",
        "telephone": "+5511939470374",
        "email": "docuraverasbuffet@yahoo.com.br",
        "priceRange": "$$$$",
        "servesCuisine": "Gastronomia artesanal premium",
        "areaServed": [
          { "@type": "City", "name": "São Paulo", "addressRegion": "SP", "addressCountry": "BR" },
          { "@type": "City", "name": "Rio de Janeiro", "addressRegion": "RJ", "addressCountry": "BR" }
        ],
        "address": [
          {
            "@type": "PostalAddress",
            "addressLocality": "São Paulo",
            "addressRegion": "SP",
            "addressCountry": "BR"
          },
          {
            "@type": "PostalAddress",
            "addressLocality": "Rio de Janeiro",
            "addressRegion": "RJ",
            "addressCountry": "BR"
          }
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Serviços",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Coffee Break Corporativo" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Eventos Empresariais" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Eventos Esportivos" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Catering para Convenções" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Buffet Personalizado" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Coquetéis" } }
          ]
        },
        "sameAs": [
          "https://instagram.com/docuraverasbuffet"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
